<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI API 余额总览</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --border:#e5e7eb; --border-strong:#d4d8de;
    --ink:#181b21; --muted:#6b7280; --faint:#9aa1ac;
    --accent:#2f6fed; --accent-soft:#eef3fe;
    --ok:#15803d; --ok-soft:#e9f7ee;
    --err:#c92a2a; --err-soft:#fdecec;
    --warn:#b45309; --warn-soft:#fdf3e3;
    --radius:14px;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:34px 22px 70px}

  header h1{font-size:22px;margin:0 0 6px;letter-spacing:-.01em}
  header .sub{color:var(--muted);font-size:13px;margin:0}

  .bar{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    margin:22px 0 16px;padding:12px 14px;background:var(--card);
    border:1px solid var(--border);border-radius:12px;
  }
  button{
    font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--border-strong);
    background:#fff;color:var(--ink);padding:7px 14px;transition:.15s;
  }
  button:hover{border-color:#b9bfc8;background:#fafbfc}
  button:active{transform:translateY(1px)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
  button.primary:hover{background:#2560d8}
  button.primary:disabled{opacity:.6;cursor:default;transform:none}
  .chk{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;cursor:pointer;user-select:none}
  .chk input{accent-color:var(--accent);cursor:pointer}
  .sum{margin-left:auto;display:flex;gap:18px;font-size:13px}
  .sum b{font-size:16px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .sum .lbl{color:var(--faint);font-size:11px;display:block;line-height:1.2}

  .gtitle{
    margin:22px 0 11px;font-size:13px;font-weight:600;color:#3f4652;
    display:flex;align-items:center;gap:8px;
  }
  .gtitle:first-of-type{margin-top:4px}
  .gtitle span{font-weight:400;color:var(--faint);font-size:11.5px}
  .gtitle .line{flex:1;height:1px;background:var(--border);margin-left:4px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(334px,1fr));gap:14px}

  .card{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:15px 16px 14px;display:flex;flex-direction:column;gap:11px;
    transition:box-shadow .18s,border-color .18s;
  }
  .card:hover{box-shadow:0 3px 14px rgba(16,24,40,.06);border-color:var(--border-strong)}
  .card.manual{background:#fcfcfd}
  .card.dim{opacity:.4}
  .chead{display:flex;align-items:flex-start;gap:10px}
  .badge{
    width:30px;height:30px;flex:none;border-radius:9px;display:grid;place-items:center;
    background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:13px;
  }
  .card.manual .badge{background:#f1f2f4;color:#8b929c}
  .meta{flex:1;min-width:0}
  .name{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:7px}
  .dot{width:6px;height:6px;border-radius:50%;background:#d5d9e0;flex:none}
  .dot.loading{background:var(--accent);animation:pulse 1s infinite}
  .dot.done{background:var(--ok)}
  .dot.err{background:var(--err)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .hint{color:var(--faint);font-size:11.5px;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .link{color:var(--faint);text-decoration:none;font-size:11.5px;padding-top:2px;flex:none}
  .link:hover{color:var(--accent)}

  .keyrow{display:flex;gap:7px}
  .keyrow input, .customrow input{
    flex:1;min-width:0;font:inherit;font-size:12.5px;padding:7px 10px;border-radius:8px;
    border:1px solid var(--border);background:#fbfcfd;color:var(--ink);outline:none;transition:.15s;
  }
  .keyrow input:focus,.customrow input:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(47,111,237,.1)}
  .keyrow input::placeholder,.customrow input::placeholder{color:#b3b9c2}
  .q{padding:7px 13px;font-size:12.5px;flex:none;border-radius:8px;background:#f7f8fa}
  .q:hover{background:var(--accent-soft);border-color:#c5d7fb;color:var(--accent)}
  .q:disabled{opacity:.5;cursor:default}
  .customrow{display:none}
  .card[data-kind="custom"] .customrow{display:flex}

  .res{min-height:44px;display:flex;flex-direction:column;justify-content:center}
  .amount{font-size:26px;font-weight:600;letter-spacing:-.025em;font-variant-numeric:tabular-nums;line-height:1.15}
  .amount .cur{font-size:14px;color:var(--muted);font-weight:500;margin-right:2px}
  .amount.none{font-size:13.5px;font-weight:500;color:var(--muted);letter-spacing:0}
  .amount .tag{
    font-size:10.5px;font-weight:500;color:var(--faint);background:#f1f3f5;
    padding:1px 6px;border-radius:5px;margin-left:7px;vertical-align:3px;letter-spacing:0;
  }
  .rows{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 14px}
  .rows div{font-size:11.5px;color:var(--muted)}
  .rows span{color:var(--ink);font-variant-numeric:tabular-nums}
  .msg{font-size:12.5px;line-height:1.5}
  .msg.err{color:var(--err)}
  .msg.warn{color:var(--warn)}
  .msg.ok{color:var(--ok)}
  .msg .sub{display:block;color:var(--faint);font-size:11px;margin-top:3px}

  .manrow{display:flex;align-items:center;gap:7px;padding-top:9px;border-top:1px dashed var(--border)}
  .manlbl{font-size:11.5px;color:var(--faint);flex:none;white-space:nowrap}
  .manrow input{
    flex:1;min-width:0;font:inherit;font-size:12.5px;padding:6px 9px;border-radius:7px;
    border:1px solid var(--border);background:#fff;color:var(--ink);outline:none;transition:.15s;
    font-variant-numeric:tabular-nums;
  }
  .manrow input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,111,237,.1)}
  .manrow input::placeholder{color:#b3b9c2}
  .manrow select{
    font:inherit;font-size:12.5px;padding:6px 4px;border-radius:7px;border:1px solid var(--border);
    background:#fff;color:var(--muted);outline:none;cursor:pointer;flex:none;
  }

  pre.raw{
    display:none;margin:0;padding:9px 10px;background:#f7f8fa;border:1px solid var(--border);
    border-radius:8px;font-size:11px;line-height:1.45;max-height:220px;overflow:auto;
    color:#3f4652;white-space:pre-wrap;word-break:break-all;
  }
  .showraw pre.raw{display:block}

  footer{margin-top:30px;color:var(--faint);font-size:11.5px;line-height:1.7;border-top:1px solid var(--border);padding-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>AI API 余额总览</h1>
    <p class="sub">能自动查的自动查；官方不给接口的（Claude、OpenAI、Gemini 等）手动填一次。全部汇总在一起。</p>
  </header>

  <div class="bar">
    <button id="all" class="primary">全部查询</button>
    <label class="chk"><input type="checkbox" id="onlySet"> 只看已填的</label>
    <label class="chk"><input type="checkbox" id="showRaw"> 显示原始响应</label>
    <div class="sum" id="sum"></div>
  </div>

  <div id="groups"></div>

  <footer>
    查询走官方只读接口，不发推理请求，不消耗 Token、不产生费用。<br>
    Claude / OpenAI 需要组织管理员创建的 <b>Admin Key</b>（sk-ant-admin… / sk-admin…），普通项目 Key 会返回 401；它们查的是本月花费，余额官方不给，可手填。<br>
    Gemini、通义、豆包、文心、混元、Mistral、Groq 等平台无公开余额接口，填一次手动余额即可纳入汇总。
  </footer>
</div>

<script>
const groupsEl = document.getElementById('groups');
const sumEl = document.getElementById('sum');
const state = { providers: [], results: {}, keys: {}, manual: {} };

const initial = n => (n.match(/[A-Za-z]/) ? n.match(/[A-Za-z]/)[0].toUpperCase() : n[0]);
const symOf = c => (c === 'CNY' ? '¥' : c === 'USD' ? '$' : '');
function fmtMoney(v) {
  if (v === null || v === undefined || v === '') return null;
  const n = Number(v);
  if (Number.isNaN(n)) return String(v);
  return n.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function manualRow(p) {
  const saved = state.manual[p.id] || {};
  const cur = saved.cur || p.currency;
  return `
    <div class="manrow">
      <span class="manlbl">${p.kind === 'spend' ? '手动余额' : '余额'}</span>
      <input type="number" class="m" step="0.01" min="0" placeholder="填了即计入汇总"
             value="${saved.v !== undefined ? saved.v : ''}" autocomplete="off">
      <select class="mc">
        <option value="CNY"${cur === 'CNY' ? ' selected' : ''}>¥</option>
        <option value="USD"${cur === 'USD' ? ' selected' : ''}>$</option>
      </select>
    </div>`;
}

function buildCard(p) {
  const card = document.createElement('div');
  card.className = 'card' + (p.kind === 'manual' ? ' manual' : '');
  card.dataset.id = p.id;
  card.dataset.kind = p.kind;

  const needKey = p.kind !== 'manual';
  const showManual = p.kind === 'manual' || p.kind === 'spend';

  card.innerHTML = `
    <div class="chead">
      <div class="badge">${initial(p.name)}</div>
      <div class="meta">
        <div class="name">${escapeHtml(p.name)}<i class="dot"></i></div>
        <div class="hint" title="${escapeHtml(p.hint)}">${escapeHtml(p.hint)}</div>
      </div>
      ${p.console ? `<a class="link" href="${p.console}" target="_blank" rel="noopener">后台 ↗</a>` : ''}
    </div>
    ${needKey ? `
      <div class="keyrow">
        <input type="password" class="k" placeholder="粘贴 API Key" autocomplete="off" spellcheck="false">
        <button class="q">${p.kind === 'spend' ? '查花费' : '查询'}</button>
      </div>
      ${p.kind === 'custom' ? '<div class="customrow"><input type="text" class="u" placeholder="中转站地址，如 https://api.xxx.com/v1" autocomplete="off" spellcheck="false"></div>' : ''}
      <div class="res"></div>` : ''}
    ${showManual ? manualRow(p) : ''}
    <pre class="raw"></pre>
  `;

  if (p.kind === 'manual') {
    const r = document.createElement('div');
    r.className = 'res';
    card.insertBefore(r, card.querySelector('.manrow'));
    renderManual(card, p);
  } else if (p.kind === 'spend') {
    card.querySelector('.res').innerHTML = `<div class="msg" style="color:var(--faint)">填 Admin Key 可查本月花费</div>`;
  }

  if (needKey) {
    const input = card.querySelector('.k');
    const btn = card.querySelector('.q');
    const urlInput = card.querySelector('.u');
    if (p.key_hint) input.placeholder = p.key_hint;
    if (state.keys[p.id]) input.placeholder = state.keys[p.id] + '（已保存）';
    if (urlInput && state.keys[p.id + '__url']) urlInput.placeholder = state.keys[p.id + '__url'];

    let timer = null;
    input.addEventListener('input', () => {
      clearTimeout(timer);
      timer = setTimeout(() => saveKey(p.id, input.value.trim()), 700);
    });
    if (urlInput) urlInput.addEventListener('input', () => {
      clearTimeout(timer);
      timer = setTimeout(() => saveKey(p.id + '__url', urlInput.value.trim()), 700);
    });
    btn.addEventListener('click', () => run(p, input.value.trim(), urlInput ? urlInput.value.trim() : ''));
    input.addEventListener('keydown', e => { if (e.key === 'Enter') btn.click(); });
    if (urlInput) urlInput.addEventListener('keydown', e => { if (e.key === 'Enter') btn.click(); });
  }

  if (showManual) {
    const m = card.querySelector('.m');
    const mc = card.querySelector('.mc');
    const sync = () => {
      const v = m.value.trim();
      const cur = mc.value;
      if (v === '' || Number.isNaN(parseFloat(v))) delete state.manual[p.id];
      else state.manual[p.id] = { v: parseFloat(v), cur };
      saveManual(p.id, v, cur);
      renderManual(card, p);
      renderSum();
    };
    m.addEventListener('input', sync);
    mc.addEventListener('change', sync);
  }
  return card;
}

function renderManual(card, p) {
  if (p.kind !== 'manual') return;
  const m = state.manual[p.id];
  const res = card.querySelector('.res');
  if (!res) return;
  if (m && !Number.isNaN(m.v)) {
    res.innerHTML = `<div class="amount"><span class="cur">${symOf(m.cur)}</span>${fmtMoney(m.v)}<span class="tag">手动</span></div>`;
  } else {
    res.innerHTML = `<div class="msg" style="color:var(--faint)">未填写 —— 去后台看一眼填进来</div>`;
  }
}

async function saveKey(id, val) {
  try {
    await fetch('/api/keys', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, key: val })
    });
    if (val) state.keys[id] = val.slice(0, 6) + '••••' + val.slice(-4);
    else delete state.keys[id];
  } catch (e) {}
}
async function saveManual(id, v, cur) {
  try {
    await fetch('/api/keys', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: id + '__manual', key: v === '' ? '' : v + '|' + cur })
    });
  } catch (e) {}
}

async function run(p, key, baseUrl) {
  const card = document.querySelector(`.card[data-id="${p.id}"]`);
  if (!card) return;
  const dot = card.querySelector('.dot');
  const res = card.querySelector('.res');
  const btn = card.querySelector('.q');
  dot.className = 'dot loading';
  res.innerHTML = `<div class="msg" style="color:var(--faint)">查询中…</div>`;
  if (btn) btn.disabled = true;

  try {
    const r = await fetch('/api/query', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: p.id, key, baseUrl })
    });
    const d = await r.json();
    state.results[p.id] = d;
    render(p, card, d);
    renderSum();
  } catch (e) {
    dot.className = 'dot err';
    res.innerHTML = `<div class="msg err">请求本地服务失败<span class="sub">服务是不是已经关掉了？</span></div>`;
  } finally {
    if (btn) btn.disabled = false;
  }
}

function render(p, card, d) {
  const dot = card.querySelector('.dot');
  const res = card.querySelector('.res');
  const raw = card.querySelector('.raw');
  if (raw) raw.textContent = d.raw ? JSON.stringify(d.raw, null, 2) : (d.raw_text || '');

  if (d.ok) {
    dot.className = 'dot done';
    const money = fmtMoney(d.main);
    const cur = symOf(d.currency);
    const tag = d.kind === 'spend' ? '<span class="tag">本月花费</span>' : '';
    let html = money !== null
      ? `<div class="amount"><span class="cur">${cur}</span>${money}${tag}</div>`
      : `<div class="amount none">已返回配额，见下方明细</div>`;
    const rows = (d.rows || []).filter(r => r[1] !== null && r[1] !== undefined && r[1] !== '');
    if (rows.length) html += `<div class="rows">${rows.map(r => `<div>${escapeHtml(r[0])} <span>${escapeHtml(r[1])}</span></div>`).join('')}</div>`;
    if (d.note) html += `<div class="msg warn" style="margin-top:6px">${escapeHtml(d.note)}</div>`;
    res.innerHTML = html;
  } else if (d.manual) {
    res.innerHTML = `<div class="msg" style="color:var(--muted)">无公开余额接口，手动填下方金额</div>`;
  } else {
    dot.className = 'dot err';
    const code = d.status ? `<span class="sub">HTTP ${d.status}${d.elapsed ? ' · ' + d.elapsed + 'ms' : ''}</span>` : '';
    res.innerHTML = `<div class="msg err">${escapeHtml(d.error || '查询失败')}${code}</div>`;
  }
}

function renderSum() {
  const acc = {};
  for (const [id, d] of Object.entries(state.results)) {
    if (!d.ok || d.kind === 'spend' || d.main === null || d.main === undefined) continue;
    const p = state.providers.find(x => x.id === id);
    if (!p || p.kind === 'quota' || p.kind === 'spend') continue;
    const n = Number(d.main);
    if (Number.isNaN(n)) continue;
    const cur = d.currency || 'CNY';
    acc[cur] = (acc[cur] || 0) + n;
  }
  for (const [, m] of Object.entries(state.manual)) {
    if (!m || Number.isNaN(m.v)) continue;
    acc[m.cur] = (acc[m.cur] || 0) + m.v;
  }
  const keys = Object.keys(acc);
  if (!keys.length) { sumEl.innerHTML = '<span class="lbl">还没数据</span>'; return; }
  sumEl.innerHTML = keys.map(c =>
    `<div><span class="lbl">合计 ${c}</span><b>${symOf(c)}${fmtMoney(acc[c])}</b></div>`
  ).join('');
}

document.getElementById('showRaw').addEventListener('change', e => {
  document.querySelectorAll('.card').forEach(c => c.classList.toggle('showraw', e.target.checked));
});

document.getElementById('onlySet').addEventListener('change', e => {
  document.querySelectorAll('.card').forEach(c => {
    const id = c.dataset.id;
    const k = c.querySelector('.k');
    const m = c.querySelector('.m');
    const has = (k && k.value.trim()) || state.keys[id] || (m && m.value.trim());
    c.classList.toggle('dim', e.target.checked && !has);
  });
});

document.getElementById('all').addEventListener('click', async () => {
  const btn = document.getElementById('all');
  btn.disabled = true; btn.textContent = '查询中…';
  const jobs = state.providers
    .filter(p => p.kind !== 'manual')
    .map(p => {
      const card = document.querySelector(`.card[data-id="${p.id}"]`);
      const key = card.querySelector('.k').value.trim();
      const u = card.querySelector('.u');
      const url = u ? u.value.trim() : '';
      if (!key && !state.keys[p.id]) return null;
      if (p.kind === 'custom' && !url && !state.keys[p.id + '__url']) return null;
      return run(p, key, url);
    }).filter(Boolean);

  if (!jobs.length) {
    btn.disabled = false; btn.textContent = '全部查询';
    alert('还没有填任何 Key，先在卡片里粘一个试试。');
    return;
  }
  await Promise.allSettled(jobs);
  renderSum();
  btn.disabled = false; btn.textContent = '全部查询';
});

(async function init() {
  const [pr, ks] = await Promise.all([
    fetch('/api/providers').then(r => r.json()),
    fetch('/api/keys').then(r => r.json()).catch(() => ({}))
  ]);
  state.providers = pr.providers || [];
  state.keys = ks || {};

  for (const [k, v] of Object.entries(state.keys)) {
    if (k.endsWith('__manual') && v) {
      const id = k.slice(0, -8);
      const parts = String(v).split('|');
      const n = parseFloat(parts[0]);
      if (!Number.isNaN(n)) state.manual[id] = { v: n, cur: parts[1] || 'CNY' };
    }
  }

  const auto = state.providers.filter(p => p.group === 'auto');
  const manual = state.providers.filter(p => p.group === 'manual');

  const g1 = document.createElement('div');
  g1.className = 'gtitle';
  g1.innerHTML = `自动查询 <span>${auto.length} 个平台，填 Key 即可</span><i class="line"></i>`;
  const grid1 = document.createElement('div');
  grid1.className = 'grid';
  auto.forEach(p => grid1.appendChild(buildCard(p)));

  const g2 = document.createElement('div');
  g2.className = 'gtitle';
  g2.innerHTML = `手动记账 <span>${manual.length} 个平台官方无接口，填一次余额就能汇总</span><i class="line"></i>`;
  const grid2 = document.createElement('div');
  grid2.className = 'grid';
  manual.forEach(p => grid2.appendChild(buildCard(p)));

  groupsEl.append(g1, grid1, g2, grid2);
  renderSum();
})();
</script>
</body>
</html>
